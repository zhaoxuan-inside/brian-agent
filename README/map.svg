<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <style>
      .flow { stroke-dashoffset: 0; animation: dashflow 1.8s linear infinite; }
      @keyframes dashflow { to { stroke-dashoffset: -22.2; } }
      .pulse { animation: pinpulse 2s ease-in-out infinite; }
      @keyframes pinpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .n1 { animation: floaty 6.5s ease-in-out infinite; }
      .n2 { animation: floaty 7.5s ease-in-out 0.8s infinite; }
      .n3 { animation: floaty 7s ease-in-out 1.6s infinite; }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .ntitle { font-size: 13.5px; fill: #3A3A3C; font-weight: 600; }
      .nsub { font-size: 11.5px; fill: #8E8E93; }
    </style>
  </defs>

  <!-- 画布卡片 -->
  <rect x="0" y="0" width="960" height="580" rx="18" fill="#FFFFFF" stroke="#D1D1D6"/>
  <rect x="14" y="14" width="932" height="552" rx="12" fill="#FAFBFD"/>
  <text x="34" y="44" font-size="13" fill="#8E8E93">对话 · 记忆地图</text>
  <circle cx="916" cy="39" r="4" fill="#007AFF" opacity="0.8"/>
  <circle cx="900" cy="39" r="4" fill="#AF52DE" opacity="0.6"/>
  <circle cx="884" cy="39" r="4" fill="#FF9500" opacity="0.8"/>

  <!-- 图例 -->
  <g>
    <rect x="604" y="470" width="330" height="78" rx="10" fill="#F5F5F7" stroke="#D1D1D6"/>
    <line x1="624" y1="494" x2="664" y2="494" stroke="#007AFF" stroke-width="2.2"/>
    <text x="676" y="498" font-size="12" fill="#3A3A3C">提问 / 回答（上下文延续）</text>
    <line x1="624" y1="518" x2="664" y2="518" stroke="#AF52DE" stroke-width="2" stroke-dasharray="0.1 9" stroke-linecap="round"/>
    <text x="676" y="522" font-size="12" fill="#3A3A3C">引用关系（可勾选）</text>
    <circle class="pulse" cx="644" cy="540" r="4.5" fill="#FF9500"/>
    <text x="676" y="544" font-size="12" fill="#3A3A3C">Pin（永久生效）</text>
  </g>

  <!-- 连线：实线=上下文延续，虚线=引用（流动） -->
  <path d="M 165 140 C 165 172 165 198 165 248" fill="none" stroke="#007AFF" stroke-width="1.6" opacity="0.65"/>
  <path class="flow" d="M 255 295 C 350 295 400 300 495 300" fill="none" stroke="#AF52DE" stroke-width="1.5" stroke-dasharray="0.1 11" stroke-linecap="round" opacity="0.7"/>
  <path d="M 600 360 C 600 392 600 408 600 448" fill="none" stroke="#007AFF" stroke-width="1.6" opacity="0.65"/>
  <path class="flow" d="M 255 290 C 430 290 540 138 665 138" fill="none" stroke="#AF52DE" stroke-width="1.5" stroke-dasharray="0.1 11" stroke-linecap="round" opacity="0.55"/>
  <path d="M 775 172 C 775 206 775 248 775 282" fill="none" stroke="#007AFF" stroke-width="1.6" opacity="0.65"/>

  <!-- 节点 1：提问 -->
  <g class="n1">
    <rect x="60" y="58" width="210" height="82" rx="12" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text class="ntitle" x="76" y="88">北京今天天气怎么样？</text>
    <text class="nsub" x="76" y="112">提问</text>
  </g>

  <!-- 节点 2：天气回答（Pin） -->
  <g class="n2">
    <rect x="60" y="248" width="210" height="96" rx="12" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text class="ntitle" x="76" y="278">多云转小雨 29/21℃</text>
    <text class="nsub" x="76" y="302">风力 3 级 · 傍晚有雨</text>
    <circle class="pulse" cx="250" cy="268" r="4.5" fill="#FF9500"/>
  </g>

  <!-- 节点 3：追问（引用天气） -->
  <g class="n3">
    <rect x="495" y="262" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#AF52DE" stroke-width="1.6"/>
    <text class="ntitle" x="511" y="292">追问：适合穿什么？</text>
    <text class="nsub" x="511" y="316">引用了上一条天气</text>
  </g>

  <!-- 节点 4：回答 -->
  <g class="n1">
    <rect x="495" y="448" width="210" height="64" rx="12" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text class="ntitle" x="511" y="472">短袖 + 薄外套 + 雨伞</text>
    <text class="nsub" x="511" y="494">上下文延续自上一条</text>
  </g>

  <!-- 节点 5：新话题（勾选天气作依据） -->
  <g class="n2">
    <rect x="665" y="76" width="220" height="96" rx="12" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text class="ntitle" x="681" y="106">下午去博物馆还是商场？</text>
    <text class="nsub" x="681" y="130">勾选了「天气」作为依据</text>
    <circle class="pulse" cx="866" cy="96" r="4.5" fill="#FF9500"/>
  </g>

  <!-- 节点 6：建议（Pin） -->
  <g class="n3">
    <rect x="665" y="282" width="220" height="96" rx="12" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text class="ntitle" x="681" y="312">建议上午户外，下午室内</text>
    <text class="nsub" x="681" y="336">点节点可跳回原文</text>
  </g>
</svg>
