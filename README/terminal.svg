<svg xmlns="http://www.w3.org/2000/svg" width="900" height="252" viewBox="0 0 900 252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace">
  <defs>
    <style>
      .cmd { fill: #34C759; font-size: 14.5px; font-weight: 600; }
      .out { fill: #CFE0FF; font-size: 14.5px; }
      .dim { fill: #8E93A8; font-size: 14.5px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="252" rx="16" fill="#060910" stroke="#3A3A3C"/>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <circle cx="26" cy="22" r="5.5" fill="#FF5F57"/>
  <circle cx="46" cy="22" r="5.5" fill="#FEBC2E"/>
  <circle cx="66" cy="22" r="5.5" fill="#28C840"/>
  <text x="86" y="27" font-size="12.5" fill="#8E93A8" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">bash</text>

  <text class="cmd" x="30" y="86">$ npm i -g brian-agent</text>
  <text class="cmd" x="30" y="124">$ brian start</text>

  <text class="out" x="30" y="168">  ▲ Brian-Agent 运行中  →  http://127.0.0.1:8000</text>
  <text class="dim" x="30" y="206">  · 打开 /config 填入你的 API Key，开始对话</text>

  <rect class="cursor" x="356" y="192" width="8" height="18" fill="#32ADE6"/>
</svg>
