<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="820" height="260" rx="18" fill="#FFFFFF" stroke="#D1D1D6"/>
  <line x1="0" y1="46" x2="820" y2="46" stroke="#E5E5EA"/>

  <circle cx="24" cy="23" r="5.5" fill="#FF5F57"/>
  <circle cx="44" cy="23" r="5.5" fill="#FEBC2E"/>
  <circle cx="64" cy="23" r="5.5" fill="#28C840"/>
  <text x="84" y="28" font-size="12.5" fill="#8E8E93">需求理解确认</text>

  <text x="32" y="92" font-size="15.5" fill="#1F2937" font-weight="600">你好像想说的是：为一个「周末两天的北京行程」做规划，且只考虑室内外兼顾。</text>
  <text x="32" y="120" font-size="15.5" fill="#1F2937" font-weight="600">是这个意思吗？</text>

  <g>
    <rect x="32" y="150" width="112" height="34" rx="9" fill="#007AFF"/>
    <text x="88" y="172" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">按理解执行</text>
    <rect x="156" y="150" width="112" height="34" rx="9" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text x="212" y="172" text-anchor="middle" font-size="13" fill="#3A3A3C">按原文执行</text>
    <rect x="280" y="150" width="84" height="34" rx="9" fill="#F5F5F7" stroke="#D1D1D6"/>
    <text x="322" y="172" text-anchor="middle" font-size="13" fill="#3A3A3C">取消</text>
  </g>

  <text x="32" y="228" font-size="13" fill="#8E8E93">匹配度 0.62 / 阈值 0.75 · 判断依据：问题过于宽泛，缺少时间与范围约束</text>
  <text x="788" y="228" text-anchor="end" font-size="13" fill="#FF9500" font-weight="600">主动确认，而不是硬答</text>
</svg>
