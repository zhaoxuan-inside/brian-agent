<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <style>
      .stepnum { font-size: 12px; font-weight: 700; fill: #007AFF; }
      .steplab { font-size: 14.5px; fill: #3A3A3C; font-weight: 600; }
      .steptime { font-size: 12.5px; fill: #8E8E93; font-family: ui-monospace,Menlo,Consolas,monospace; }
      .ov { font-size: 17px; font-weight: 700; fill: #1F2937; }
      .ovl { font-size: 11.5px; fill: #8E8E93; }
      .lit { animation: lightup 4s ease-in-out infinite; }
      @keyframes lightup { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="560" rx="18" fill="#FFFFFF" stroke="#D1D1D6"/>
  <line x1="0" y1="46" x2="880" y2="46" stroke="#E5E5EA"/>

  <!-- 窗口栏 -->
  <circle cx="24" cy="23" r="5.5" fill="#FF5F57"/>
  <circle cx="44" cy="23" r="5.5" fill="#FEBC2E"/>
  <circle cx="64" cy="23" r="5.5" fill="#28C840"/>
  <text x="84" y="28" font-size="12.5" fill="#8E8E93">思考过程 · 执行时间线</text>

  <!-- 概览 -->
  <g>
    <rect x="24" y="66" width="196" height="56" rx="12" fill="#F5F5F7"/>
    <text class="ov" x="122" y="90" text-anchor="middle">12.4s</text>
    <text class="ovl" x="122" y="112" text-anchor="middle">总耗时</text>
    <rect x="232" y="66" width="196" height="56" rx="12" fill="#F5F5F7"/>
    <text class="ov" x="330" y="90" text-anchor="middle">3,148</text>
    <text class="ovl" x="330" y="112" text-anchor="middle">输入 Token</text>
    <rect x="440" y="66" width="196" height="56" rx="12" fill="#F5F5F7"/>
    <text class="ov" x="538" y="90" text-anchor="middle">5</text>
    <text class="ovl" x="538" y="112" text-anchor="middle">工具调用</text>
    <rect x="648" y="66" width="196" height="56" rx="12" fill="#F5F5F7"/>
    <text class="ov" x="746" y="90" text-anchor="middle">1</text>
    <text class="ovl" x="746" y="112" text-anchor="middle">需求确认</text>
  </g>

  <!-- 步骤 -->
  <g>
    <rect x="24" y="140" width="820" height="48" rx="10" fill="none"/>
    <circle cx="48" cy="164" r="13" fill="#E8F1FF"/>
    <text class="stepnum" x="48" y="168" text-anchor="middle">1</text>
    <text class="steplab" x="74" y="169">需求理解 Agent</text>
    <text class="steptime" x="828" y="169" text-anchor="end">0.8s</text>

    <rect x="24" y="196" width="820" height="48" rx="10" fill="none"/>
    <circle cx="48" cy="220" r="13" fill="#E8F1FF"/>
    <text class="stepnum" x="48" y="224" text-anchor="middle">2</text>
    <text class="steplab" x="74" y="225">选择 Agent 与模型</text>
    <text class="steptime" x="828" y="225" text-anchor="end">1.2s</text>

    <rect x="24" y="252" width="820" height="48" rx="10" fill="none"/>
    <circle cx="48" cy="276" r="13" fill="#E8F1FF"/>
    <text class="stepnum" x="48" y="280" text-anchor="middle">3</text>
    <text class="steplab" x="74" y="281">组件装配 · Skill / MCP</text>
    <text class="steptime" x="828" y="281" text-anchor="end">2.1s</text>

    <!-- 高亮步骤 4 -->
    <rect class="lit" x="24" y="308" width="820" height="48" rx="10" fill="#F0F7FF" stroke="#B3D4FF"/>
    <circle cx="48" cy="332" r="13" fill="#007AFF"/>
    <text class="stepnum" x="48" y="336" text-anchor="middle" fill="#FFFFFF">4</text>
    <text class="steplab" x="74" y="337">多轮思考与工具执行</text>
    <rect x="430" y="328" width="300" height="8" rx="4" fill="#D1D1D6"/>
    <rect x="430" y="328" width="248" height="8" rx="4" fill="#007AFF"/>
    <text class="steptime" x="828" y="337" text-anchor="end">6.4s</text>

    <rect x="24" y="364" width="820" height="48" rx="10" fill="none"/>
    <circle cx="48" cy="388" r="13" fill="#E8F1FF"/>
    <text class="stepnum" x="48" y="392" text-anchor="middle">5</text>
    <text class="steplab" x="74" y="393">评估 Agent 质量打分</text>
    <text class="steptime" x="828" y="393" text-anchor="end">1.1s</text>

    <rect x="24" y="420" width="820" height="48" rx="10" fill="none"/>
    <circle cx="48" cy="444" r="13" fill="#E8F1FF"/>
    <text class="stepnum" x="48" y="448" text-anchor="middle">6</text>
    <text class="steplab" x="74" y="449">写作 Agent 美化排版</text>
    <text class="steptime" x="828" y="449" text-anchor="end">0.8s</text>
  </g>

  <text x="440" y="512" text-anchor="middle" font-size="12.5" fill="#8E8E93">整条链路可见：怎么理解需求、选了哪个模型、调了哪些工具、每步花多久、烧了多少 Token——没有一个黑盒</text>
</svg>
